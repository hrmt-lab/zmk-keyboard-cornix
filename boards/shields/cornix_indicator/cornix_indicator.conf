# Cornix RGB status indicator (WS2812, 2 LEDs per half) on the peripheral halves.
#
# Driver: gohanda11/zmk-ws2812-driver (CONFIG_WS2812_WIDGET_*), the same widget
# hitsuki46 uses. NOTE: the older hitsmaxft RGBLED_WIDGET_WS2812 symbols are NOT
# used and do not exist in this toolchain.
#
# Scope = battery + connection only. Layer indication is intentionally OFF:
# layer state lives on the central (dongle) and ZMK does not forward it to the
# peripherals where these LEDs are mounted.

# --- LED strip / SPI / external power ---
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

# --- WS2812 status widget ---
CONFIG_WS2812_WIDGET=y
CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=y
CONFIG_WS2812_WIDGET_CONN_SHOW_USB=n
# Layer indication stays enabled ONLY so the driver compiles: get_layer_color()
# in the driver unconditionally references the LAYER_*_COLOR symbols, which exist
# only when this is =y. On a peripheral the layer listener is compiled out
# (central-only), so NO layer color is ever shown here regardless of this value.
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n

# --- Timing (stock-like, slightly slow indication) ---
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=400
CONFIG_WS2812_WIDGET_CONN_BLINK_MS=300
CONFIG_WS2812_WIDGET_INTERVAL_MS=200

# --- Battery thresholds ---
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_HIGH=80
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_CRITICAL=5

# --- Colors (~25% brightness, stock cornix palette) ---
# Battery: high=green, medium=yellow, low/critical=red (stock blinks red when low)
CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x004000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0x404000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0x400000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0x400000
CONFIG_WS2812_WIDGET_COLOR_OFF=0x000000
# Connectivity: connected=blue (stock uses blue for the link), disconnected=red
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x000040
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0x400000
